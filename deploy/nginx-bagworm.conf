# /etc/nginx/sites-available/bagworm  (__DOMAIN__ is replaced by setup_vm.sh;
# certbot then adds the HTTPS server block and the http->https redirect)
server {
    listen 80;
    server_name __DOMAIN__;

    # one photo per upload request (app limit is 50 MB)
    client_max_body_size 52m;

    # stream uploads straight to the app instead of buffering them to disk first
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /static/ {
        alias /srv/bagworm/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
